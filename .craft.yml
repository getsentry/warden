minVersion: 3.9.0
changelog:
  policy: auto
preReleaseCommand: bash bin/bump-version.sh
targets:
  - name: npm
    id: "@sentry/warden-service-api"
    includeNames: /^sentry-warden-service-api-\d.*\.tgz$/
    access: public
  - name: npm
    id: "@sentry/warden"
    includeNames: /^sentry-warden-\d.*\.tgz$/
    access: public
  - name: github
    tagPrefix: v
    # No floatingTags: update-major-tag.yml moves v0. See specs/release-process.md.
