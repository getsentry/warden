name: Security Evals

# Manual only. Runs security-review and the wrdn-* security skills over the
# sentry vulnerability corpus and hand-picked cases. See packages/security-evals.
on:
  workflow_dispatch:
    inputs:
      skills:
        description: Comma-separated lanes (empty runs all six)
        default: ''
      entries:
        description: Comma-separated entry ids or prefixes ending in * (empty runs all)
        default: ''
      repeats:
        description: Passes per shard
        default: '1'
      model:
        description: Analysis model
        default: openrouter/x-ai/grok-4.5
      effort:
        description: Analysis effort
        default: high
      aux_model:
        description: Auxiliary model
        default: openrouter/openai/gpt-5.6-luna
      judge_model:
        description: Scoring model
        default: openrouter/anthropic/claude-sonnet-4.6

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SENTRY_CLONE: ${{ github.workspace }}/../sentry
      SENTRY_PYTHON_CLONE: ${{ github.workspace }}/../sentry-python
      SENTRY_WIZARD_CLONE: ${{ github.workspace }}/../sentry-wizard
      DOTAGENTS_CLONE: ${{ github.workspace }}/../dotagents
      # Must match WARDEN_SKILLS_REF in packages/security-evals/src/options.ts.
      WARDEN_SKILLS_REF: daf01f970a28450627a8d2d61d9915a742a735e2
      SKILLS_CHECKOUT: packages/security-evals/.cache/warden-skills
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: getsentry/warden-skills
          ref: ${{ env.WARDEN_SKILLS_REF }}
          path: ${{ env.SKILLS_CHECKOUT }}
          persist-credentials: false

      # Keyed on the files that pin the scanned SHAs. Older clones still restore;
      # the suite fetches whatever SHA they lack.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SENTRY_CLONE }}
          key: sentry-blobless-${{ hashFiles('packages/docs/src/data/benchmarking/sentry-vulnerability-corpus.json', 'packages/security-evals/cases/**') }}
          restore-keys: sentry-blobless-

      - name: Prepare sentry clone
        run: packages/security-evals/scripts/prepare-clone.sh getsentry/sentry "$SENTRY_CLONE"

      - name: Prepare sentry-python clone
        run: packages/security-evals/scripts/prepare-clone.sh getsentry/sentry-python "$SENTRY_PYTHON_CLONE"

      - name: Prepare sentry-wizard clone
        run: packages/security-evals/scripts/prepare-clone.sh getsentry/sentry-wizard "$SENTRY_WIZARD_CLONE"

      - name: Prepare dotagents clone
        run: packages/security-evals/scripts/prepare-clone.sh getsentry/dotagents "$DOTAGENTS_CLONE"

      - name: Run security evals
        env:
          WARDEN_OPENROUTER_API_KEY: ${{ secrets.WARDEN_OPENROUTER_API_KEY }}
          ROACH_TOKEN: ${{ secrets.ROACH_TOKEN }}
          WARDEN_SECURITY_EVALS_REPOS: getsentry/sentry=${{ env.SENTRY_CLONE }},getsentry/sentry-python=${{ env.SENTRY_PYTHON_CLONE }},getsentry/sentry-wizard=${{ env.SENTRY_WIZARD_CLONE }},getsentry/dotagents=${{ env.DOTAGENTS_CLONE }}
          WARDEN_SECURITY_EVALS_SKILLS_REPO: ${{ github.workspace }}/${{ env.SKILLS_CHECKOUT }}
          WARDEN_SECURITY_EVALS_SKILLS: ${{ inputs.skills }}
          WARDEN_SECURITY_EVALS_ENTRIES: ${{ inputs.entries }}
          WARDEN_SECURITY_EVALS_REPEATS: ${{ inputs.repeats }}
          WARDEN_SECURITY_EVALS_MODEL: ${{ inputs.model }}
          WARDEN_SECURITY_EVALS_EFFORT: ${{ inputs.effort }}
          WARDEN_SECURITY_EVALS_AUX_MODEL: ${{ inputs.aux_model }}
          WARDEN_SECURITY_EVALS_JUDGE_MODEL: ${{ inputs.judge_model }}
          # Each sentry worktree is large; drop it once its shard finishes.
          WARDEN_SECURITY_EVALS_REMOVE_WORKTREES: '1'
        run: pnpm evals:security

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: security-evals-results
          path: packages/security-evals/.cache/results.json
          if-no-files-found: warn
