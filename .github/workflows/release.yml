name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (ignored when version is set). auto picks it from the commits; pre cuts a prerelease of that version.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - pre
          - patch
          - minor
          - major
      version:
        description: Exact version override (for example, 0.53.0)
        required: false
        type: string
      force:
        description: Force release (bypass blockers)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Craft writes AI changelog summaries with the workflow token.
  copilot-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prepare Craft release tags
        run: sh bin/craft-release-tags.sh

      - name: Prepare release
        uses: getsentry/craft@68615816cdad571fdc24b7d35f45238c835affc2 # v3.11.0
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          version: ${{ inputs.version || inputs.bump }}
          force: ${{ inputs.force }}
          llm_api_key: ${{ github.token }}
