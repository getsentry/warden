name: Action Bundle

# Rebuilds dist/action on same-repo PRs and commits it back. The push uses
# an app token so CI runs again on the new commit. The build job runs PR
# code with no secrets. The commit job gets the token and runs no PR build
# or install, so no PR lifecycle script or git hook runs next to it. Fork PRs can't be pushed
# to, so the "Check action bundle is committed" step in ci.yml stays as
# the gate there and on every other commit.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: action-dist-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    # Dependabot runs get no Actions secrets, so ci.yml is the gate there.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.changes.outputs.stale }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:action

      - name: Check for bundle changes
        id: changes
        run: test -z "$(git status --porcelain -- dist/action)" || echo "stale=true" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.stale == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: action-dist
          path: dist/action/
          retention-days: 1

  commit:
    needs: build
    if: needs.build.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      # The same commit the build job used. If the branch moved since, the
      # push is not a fast-forward and fails; the new commit gets its own run.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Remove old bundle
        run: rm -rf dist/action

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: action-dist
          path: dist/action/

      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - name: Commit bundle
        env:
          PUSH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: sh bin/commit-action-dist.sh
